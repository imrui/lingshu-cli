# ==========================================
# @ruobai/lingshu — npm 发布流水线
# ==========================================
# 推送 v*.*.* tag 后自动发布到 npm 公网
# 认证方式：npm Trusted Publishing（OIDC），无需令牌、不会过期
# 前置：npmjs.com → 包 Settings → Trusted Publisher → GitHub Actions
#       Organization: imrui · Repository: lingshu-cli · Workflow: publish.yml

name: publish

on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    name: 发布到 npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC：npm 用它换取一次性发布凭证，并自动生成 provenance
    steps:
      - uses: actions/checkout@v4

      # 不设 registry-url：它会写入占位 _authToken，干扰 OIDC 交换
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Trusted Publishing 要求 npm >= 11.5.1
      - name: 升级 npm
        run: npm install -g npm@latest && npm --version

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "❌ tag ($TAG) 与 package.json version ($PKG) 不一致"
            exit 1
          fi
          echo "✅ 版本对齐: $PKG"

      - name: 跑 smoke 测试
        run: npm test

      - name: 发布到 npm（OIDC，自动附带 provenance）
        run: npm publish --access public
